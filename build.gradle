            if (latdevKeys.contains(key)) {
                if (i + 1 < rawArgs.size() && rawArgs[i + 1] instanceof String && !rawArgs[i + 1].startsWith('--')) {
                    putLatdevOption(key, rawArgs[i + 1])
                    i++
                } else {
                    putLatdevOption(key, 'true')
                }
                enabled = true
            } else {
                passthrough << token
            }
        }

        if (enabled || !latdevOptions.isEmpty()) {
            if (!latdevOptions.containsKey('out')) {
                latdevOptions['out'] = file('run-headless/seed-search').absolutePath.replace('\\', '/')
            }

            def propParts = ['enabled=true']
            latdevOptions.each { key, value ->
                propParts << "${key}=${value}"
            }
            def propValue = propParts.join(';')

            jvmArgs "-Dlatdev.biomeSearch=${propValue}"
            setArgs(passthrough)
            logger.lifecycle("[runBiomeSeedSearch] translated latdev --args to JVM property: {}", propValue)
        } else {
            setArgs(rawArgs)
        }
    }
}

tasks.named('runBandAudit').configure {
    workingDir file(latitudePreviewRunDir)
    dependsOn tasks.named('prepareBiomePreviewRunDir')
    doFirst {
        def rawArgs = new ArrayList(args ?: [])
        def latdevOptions = [:]
        def passthrough = []
        def latdevKeys = ['seed', 'radius', 'size', 'step', 'y', 'out', 'windows', 'watched', 'control'] as Set
        def mergeKeys = ['windows', 'watched', 'control'] as Set
        def putLatdevOption = { key, value ->
            if (mergeKeys.contains(key) && latdevOptions.containsKey(key) && latdevOptions[key] != null && latdevOptions[key].toString().trim().length() > 0) {
                latdevOptions[key] = "${latdevOptions[key]},${value}"
            } else {
                latdevOptions[key] = value
            }
        }
        boolean enabled = false

        for (int i = 0; i < rawArgs.size(); i++) {
            def token = rawArgs[i]
            if (!(token instanceof String) || !token.startsWith('--')) {
                passthrough << token
                continue
            }

            def body = token.substring(2)
            if (body.equalsIgnoreCase('latdevBandAudit')) {
                enabled = true
                continue
            }

            int eq = body.indexOf('=')
            if (eq >= 0) {
                def key = body.substring(0, eq).toLowerCase(Locale.ROOT)
                def value = body.substring(eq + 1)
                if (latdevKeys.contains(key)) {
                    putLatdevOption(key, value)
                    enabled = true
                } else {
                    passthrough << token
                }
                continue
            }

            def key = body.toLowerCase(Locale.ROOT)
            if (latdevKeys.contains(key)) {
                if (i + 1 < rawArgs.size() && rawArgs[i + 1] instanceof String && !rawArgs[i + 1].startsWith('--')) {
                    putLatdevOption(key, rawArgs[i + 1])
                    i++
                } else {
                    putLatdevOption(key, 'true')
                }
                enabled = true
            } else {
                passthrough << token
            }
        }

        if (enabled || !latdevOptions.isEmpty()) {
            if (!latdevOptions.containsKey('out')) {
                latdevOptions['out'] = file('run/latdev').absolutePath.replace('\\', '/')
            }

            def propParts = ['enabled=true']
            latdevOptions.each { key, value ->
                propParts << "${key}=${value}"
            }
            def propValue = propParts.join(';')

            jvmArgs "-Dlatdev.bandAudit=${propValue}"
            setArgs(passthrough)
            logger.lifecycle("[runBandAudit] translated latdev --args to JVM property: {}", propValue)
        } else {
            setArgs(rawArgs)
        }
    }
}
