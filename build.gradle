plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def latitudeGitOutput = { String... args ->
    try {
        def process = new ProcessBuilder(['git'] + args.toList())
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8').trim()
        return process.waitFor() == 0 ? output : 'unknown'
    } catch (Exception ignored) {
        return 'unknown'
    }
}

def latitudeBuildTimeUtc = {
    def format = new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'")
    format.setTimeZone(TimeZone.getTimeZone('UTC'))
    return format.format(new Date())
}

def latitudeGitCommit = latitudeGitOutput('rev-parse', 'HEAD')
def latitudeGitBranch = latitudeGitOutput('branch', '--show-current')
def latitudeGitDirty = latitudeGitOutput('status', '--porcelain', '--untracked-files=no') == '' ? 'false' : 'true'
def latitudeBuildTime = latitudeBuildTimeUtc()

def latitudeTestSequenceValue = {
    def raw = findProperty('latitudeTestSequence')
    if (raw == null || raw.toString().isBlank()) {
        throw new GradleException('latitudeTestSequence is required for TEST artifact tasks')
    }
    try {
        int parsed = Integer.parseInt(raw.toString())
        if (parsed <= 0) {
            throw new GradleException('latitudeTestSequence must be a positive integer')
        }
        return parsed
    } catch (NumberFormatException ignored) {
        throw new GradleException('latitudeTestSequence must be a positive integer')
    }
}

def latitudeTestVersionValue = { int sequence ->
    "${project.version}-test.${sequence}"
}

def latitudeTestSequenceOrZero = {
    def raw = findProperty('latitudeTestSequence')
    if (raw == null || raw.toString().isBlank()) {
        return 0
    }
    try {
        return Integer.parseInt(raw.toString())
    } catch (NumberFormatException ignored) {
        return 0
    }
}

def latitudeClientXms = (findProperty('latitudeClientXms') ?: System.getProperty('latitudeClientXms') ?: '1G').toString()
def latitudeClientXmx = (findProperty('latitudeClientXmx') ?: System.getProperty('latitudeClientXmx') ?: '2G').toString()
def latitudeRunDir = (findProperty('latitude.runDir') ?: 'run').toString()
def latitudePreviewRunDir = (findProperty('latdev.preview.runDir') ?: 'run-headless').toString()

base {
    archivesName = project.archives_base_name
}

loom {

    runs {
        client {
            runDir latitudeRunDir
            vmArg "-Xms${latitudeClientXms}"
            vmArg "-Xmx${latitudeClientXmx}"
            vmArg "-Dlatitude.dev.gitCommit=${latitudeGitCommit}"
            vmArg "-Dlatitude.dev.gitBranch=${latitudeGitBranch}"
            vmArg "-Dlatitude.dev.buildDirty=${latitudeGitDirty}"
            vmArg "-Dlatitude.dev.buildTime=${latitudeBuildTime}"
            vmArg "-Dlatitude.fixSurfaceDripstone=true"
            vmArg "-Dlatitude.fogClampIndex=${System.getProperty('latitude.fogClampIndex', '-1')}"
            vmArg "-Dlatitude.fogClampValue=${System.getProperty('latitude.fogClampValue', '16.0')}"
            // AutoCreateWorldProbe defaults ON in a dev environment; forward this so a plain
            // manual-testing launch can suppress it without touching the default for anyone else.
            vmArg "-Dlatitude.debug.autoCreateWorldProbe.disable=${System.getProperty('latitude.debug.autoCreateWorldProbe.disable', 'false')}"
            // Solar Tilt + Seasons (P1). The shipping defaults are ON / 60°, with four live-tuning dials.
            // Forwarded on the CLIENT run (not just biomePreview) because P2's sky visuals and P1's mob rules
            // run here too. Explicit -D values still provide the opt-out and tuning path.
            vmArg "-Dlatitude.solarTiltV2.enabled=${System.getProperty('latitude.solarTiltV2.enabled', 'true')}"
            vmArg "-Dlatitude.solarTilt.deltaMaxDeg=${System.getProperty('latitude.solarTilt.deltaMaxDeg', '30.0')}"
            vmArg "-Dlatitude.solarTilt.yearLengthDays=${System.getProperty('latitude.solarTilt.yearLengthDays', '360.0')}"
            vmArg "-Dlatitude.solarTilt.functionalMinDeg=${System.getProperty('latitude.solarTilt.functionalMinDeg', '60.0')}"
            vmArg "-Dlatitude.solarTilt.frozenPhaseDeg=${System.getProperty('latitude.solarTilt.frozenPhaseDeg', '0.0')}"
            // S13(a) AURORA BOREALIS (default TRUE, rides inside solarTiltV2). Forwarded in the same pass as
            // the flag (L17 discipline) so a dev client agrees with a shipped jar.
            vmArg "-Dlatitude.aurora.enabled=${System.getProperty('latitude.aurora.enabled', 'true')}"
            // S13(e) POLAR SURFACE ALLOWLIST (default TRUE). Server-side per-tick spawn rule that rides the
            // integrated server in a dev client; onsetDeg mirrors PolarHazardWindow.AMBIENT_ONSET_DEG.
            vmArg "-Dlatitude.polarSurfaceSpawns.enabled=${System.getProperty('latitude.polarSurfaceSpawns.enabled', 'true')}"
            vmArg "-Dlatitude.polarSurfaceSpawns.onsetDeg=${System.getProperty('latitude.polarSurfaceSpawns.onsetDeg', '80.0')}"
        }
        server {
            runDir latitudeRunDir
            vmArg "-Dlatitude.dev.gitCommit=${latitudeGitCommit}"
            vmArg "-Dlatitude.dev.gitBranch=${latitudeGitBranch}"
            vmArg "-Dlatitude.dev.buildDirty=${latitudeGitDirty}"
            vmArg "-Dlatitude.dev.buildTime=${latitudeBuildTime}"
        }
        clientNoSurfaceDripstoneFix {
            inherit client
            vmArg "-Dlatitude.fixSurfaceDripstone=false"
        }
        clientSeamAudit {
            inherit client
            name "Seam Audit (Autonomous Client)"
            programArg "--quickPlaySingleplayer"
            programArg System.getProperty('latitude.audit.world', 'Latitude')
            vmArg "-Dlatitude.audit.seam=true"
            vmArg "-Dlatitude.audit.bandPair=${System.getProperty('latitude.audit.bandPair', 'temperate-subpolar')}"
            vmArg "-Dlatitude.audit.edge=${System.getProperty('latitude.audit.edge', 'center')}"
            vmArg "-Dlatitude.audit.exitWhenDone=${System.getProperty('latitude.audit.exitWhenDone', 'true')}"
            vmArg "-Dlatitude.audit.alongSeamSpan=${System.getProperty('latitude.audit.alongSeamSpan', '256')}"
            vmArg "-Dlatitude.audit.crossSeamHalfWidth=${System.getProperty('latitude.audit.crossSeamHalfWidth', '96')}"
            vmArg "-Dlatitude.audit.chunksPerTick=${System.getProperty('latitude.audit.chunksPerTick', '6')}"
            vmArg "-Dlatitude.audit.readinessTimeoutTicks=${System.getProperty('latitude.audit.readinessTimeoutTicks', '3600')}"
            vmArg "-Dlatitude.audit.samples=${System.getProperty('latitude.audit.samples', '300')}"
        }
        biomePreview {
            server()
            name "Biome Preview (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.locateBoundary=${System.getProperty('latdev.locateBoundary', '')}"
            vmArg "-Dlatitude.debugWorldgenPath=${System.getProperty('latitude.debugWorldgenPath', 'false')}"
            // Terrain-aware atlas was reachable in code but not from the command line: BiomePreviewExporter
            // reads this system property, and without forwarding it the preview JVM never saw it. A
            // non-terrain-aware run nulls noiseConfig/heightView, so every column classifies flat and any
            // terrain-gated rule is invisible to the map -- a census that silently cannot see what it claims
            // to measure. Defaults false, so ordinary runs stay byte-identical.
            vmArg "-Dlatitude.atlasTerrainAware=${System.getProperty('latitude.atlasTerrainAware', 'false')}"
            vmArg "-Dlatdev.alpineAudit=${System.getProperty('latdev.alpineAudit', '')}"
            vmArg "-Dlatdev.probe=${System.getProperty('latdev.probe', '')}"
            vmArg "-Dlatdev.probe.target=${System.getProperty('latdev.probe.target', '')}"
            vmArg "-Dlatdev.probe.types=${System.getProperty('latdev.probe.types', '')}"
            vmArg "-Dlatdev.probe.names=${System.getProperty('latdev.probe.names', '')}"
            vmArg "-Dlatdev.probe.grid=${System.getProperty('latdev.probe.grid', '')}"
            vmArg "-Dlatdev.probe.out=${System.getProperty('latdev.probe.out', '')}"
            vmArg "-Dlatdev.probe.radius=${System.getProperty('latdev.probe.radius', '')}"
            vmArg "-Dlatdev.probe.maxCombos=${System.getProperty('latdev.probe.maxCombos', '')}"
            // Phase 4 terrain-wrapper mechanical proof harness (com.example.globe.dev.TerrainProofHarness).
            vmArg "-Dlatdev.terrainProof=${System.getProperty('latdev.terrainProof', 'false')}"
            vmArg "-Dlatdev.terrainProof.seed=${System.getProperty('latdev.terrainProof.seed', '')}"
            vmArg "-Dlatdev.terrainProof.radius=${System.getProperty('latdev.terrainProof.radius', '')}"
            vmArg "-Dlatdev.terrainProof.shape=${System.getProperty('latdev.terrainProof.shape', '')}"
            vmArg "-Dlatdev.terrainProof.out=${System.getProperty('latdev.terrainProof.out', '')}"
            vmArg "-Dlatdev.terrainProof.nonGlobe=${System.getProperty('latdev.terrainProof.nonGlobe', 'false')}"
            vmArg "-Dlatdev.terrainProof.replayProbe=${System.getProperty('latdev.terrainProof.replayProbe', 'false')}"
            vmArg "-Dlatdev.terrainProof.probes=${System.getProperty('latdev.terrainProof.probes', '')}"
            vmArg "-Dlatdev.terrainProof.coherence=${System.getProperty('latdev.terrainProof.coherence', 'false')}"
            // LatitudeV2Flags -- static final, read once at class-init, so these MUST reach the forked JVM
            // as real -D launch args (see LatitudeV2Flags's own "Testing note" javadoc). Every enable is
            // forwarded so a headless flag-on claim can actually be true (the L17 forwarding class).
            vmArg "-Dlatitude.terrainV2.enabled=${System.getProperty('latitude.terrainV2.enabled', 'false')}"
            vmArg "-Dlatitude.terrainV2.strength=${System.getProperty('latitude.terrainV2.strength', '0.0')}"
            vmArg "-Dlatitude.terrainV2.oceanStrengthRatio=${System.getProperty('latitude.terrainV2.oceanStrengthRatio', '1.0')}"
            vmArg "-Dlatitude.terrainV2.gripWidth=${System.getProperty('latitude.terrainV2.gripWidth', '0.8')}"
            vmArg "-Dlatitude.terrainV2.floorSightedVeto=${System.getProperty('latitude.terrainV2.floorSightedVeto', 'false')}"
            vmArg "-Dlatitude.terrainV2.carveAwareLabels=${System.getProperty('latitude.terrainV2.carveAwareLabels', 'false')}"
            vmArg "-Dlatitude.voidTaming.enabled=${System.getProperty('latitude.voidTaming.enabled', 'false')}"
            vmArg "-Dlatitude.voidTaming.strength=${System.getProperty('latitude.voidTaming.strength', '0.0')}"
            vmArg "-Dlatitude.voidTaming.onsetDeg=${System.getProperty('latitude.voidTaming.onsetDeg', '82.0')}"
            vmArg "-Dlatitude.voidTaming.fullDeg=${System.getProperty('latitude.voidTaming.fullDeg', '85.0')}"
            vmArg "-Dlatitude.voidTaming.protectFloorY=${System.getProperty('latitude.voidTaming.protectFloorY', '48')}"
            vmArg "-Dlatitude.voidTaming.floorFeatherBlocks=${System.getProperty('latitude.voidTaming.floorFeatherBlocks', '10')}"
            vmArg "-Dlatitude.boundaryV2.enabled=${System.getProperty('latitude.boundaryV2.enabled', 'false')}"
            vmArg "-Dlatitude.passageV2.enabled=${System.getProperty('latitude.passageV2.enabled', 'true')}"
            vmArg "-Dlatitude.polePassageV2.enabled=${System.getProperty('latitude.polePassageV2.enabled', 'true')}"
            vmArg "-Dlatitude.edgeStructureVeto.enabled=${System.getProperty('latitude.edgeStructureVeto.enabled', 'true')}"
            vmArg "-Dlatitude.polarOutfitting.enabled=${System.getProperty('latitude.polarOutfitting.enabled', 'false')}"
            vmArg "-Dlatitude.polarVegetationFade.enabled=${System.getProperty('latitude.polarVegetationFade.enabled', 'true')}"
            vmArg "-Dlatitude.polarVegetationFade.onsetDeg=${System.getProperty('latitude.polarVegetationFade.onsetDeg', '72.0')}"
            vmArg "-Dlatitude.polarVegetationFade.fullDeg=${System.getProperty('latitude.polarVegetationFade.fullDeg', '80.0')}"
            vmArg "-Dlatitude.polarVegetationFade.fireflyBanDeg=${System.getProperty('latitude.polarVegetationFade.fireflyBanDeg', '50.0')}"
            vmArg "-Dlatitude.polarBarrens.enabled=${System.getProperty('latitude.polarBarrens.enabled', 'true')}"
            // S21c 2026-07-19: the Barrens onset is a LITERAL 82.0 (decoupled from the veg-fade fullDeg of 80);
            // the 80-82 band is bare tundra before the barrens claim. .fullDeg 84 holds the fray at +2.
            vmArg "-Dlatitude.polarBarrens.onsetDeg=${System.getProperty('latitude.polarBarrens.onsetDeg', '82.0')}"
            vmArg "-Dlatitude.polarBarrens.fullDeg=${System.getProperty('latitude.polarBarrens.fullDeg', '84.0')}"
            vmArg "-Dlatitude.glacialCavesV1=${System.getProperty('latitude.glacialCavesV1', 'true')}"
            vmArg "-Dlatitude.polarWaterFreeze.enabled=${System.getProperty('latitude.polarWaterFreeze.enabled', 'true')}"
            vmArg "-Dlatitude.geoV2.enabled=${System.getProperty('latitude.geoV2.enabled', 'false')}"
            vmArg "-Dlatitude.climateV2.enabled=${System.getProperty('latitude.climateV2.enabled', 'false')}"
            vmArg "-Dlatitude.biomeConsumerV2.enabled=${System.getProperty('latitude.biomeConsumerV2.enabled', 'false')}"
            vmArg "-Dlatitude.biomeConsumerV2.oceanAuthority.enabled=${System.getProperty('latitude.biomeConsumerV2.oceanAuthority.enabled', 'false')}"
            vmArg "-Dlatitude.solarTiltV2.enabled=${System.getProperty('latitude.solarTiltV2.enabled', 'true')}"
            vmArg "-Dlatitude.solarTilt.deltaMaxDeg=${System.getProperty('latitude.solarTilt.deltaMaxDeg', '30.0')}"
            vmArg "-Dlatitude.solarTilt.yearLengthDays=${System.getProperty('latitude.solarTilt.yearLengthDays', '360.0')}"
            vmArg "-Dlatitude.solarTilt.functionalMinDeg=${System.getProperty('latitude.solarTilt.functionalMinDeg', '60.0')}"
            vmArg "-Dlatitude.solarTilt.frozenPhaseDeg=${System.getProperty('latitude.solarTilt.frozenPhaseDeg', '0.0')}"
            vmArg "-Dlatitude.polarSurfaceSpawns.enabled=${System.getProperty('latitude.polarSurfaceSpawns.enabled', 'true')}"
            vmArg "-Dlatitude.polarSurfaceSpawns.onsetDeg=${System.getProperty('latitude.polarSurfaceSpawns.onsetDeg', '80.0')}"
        }
        biomeSeedSearch {
            server()
            name "Biome Seed Search (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.biomeSearch=${System.getProperty('latdev.biomeSearch', 'enabled')}"
        }
        bandAudit {
            server()
            name "Band Audit (Headless)"
            runDir latitudePreviewRunDir
            vmArg "-Xms2G"
            vmArg "-Xmx8G"
            vmArg "-Dlatdev.bandAudit=${System.getProperty('latdev.bandAudit', 'enabled')}"
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.ladysnake.org/releases' }
    mavenCentral()
    maven { url 'https://cursemaven.com' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // CRITICAL FIX: Fabric API only needed at RUNTIME (not compile-time)
    // The Mixin approach doesn't import any Fabric API classes
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // MixinExtras for descriptor-based injections
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.0"
    include "io.github.llamalad7:mixinextras-fabric:0.5.0"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
// DISABLED (was crashing compile):     annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"
    
    compileOnly "maven.modrinth:placeholder-api:${project.placeholder_api_version}"
    runtimeOnly "maven.modrinth:placeholder-api:${project.placeholder_api_version}"

    // Pure-JVM unit tests for the Core Logic layer (no Minecraft imports, no Loom test-mod wiring).
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Gson for the pure-JVM config round-trip tests (main code gets gson from the Minecraft
    // libraries, which are not on the test classpath).
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

sourceSets {
    latitudeTest {
        java.srcDir 'src/latitudeTest/java'
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    latitudeTestImplementation.extendsFrom implementation
    latitudeTestRuntimeOnly.extendsFrom runtimeOnly
    latitudeSodiumFogVerifier
}

dependencies {

test {
    useJUnitPlatform()
    reports.junitXml.required = false
    reports.html.required = false
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle("Latitude tests: " + result.testCount + " total, " + result.successfulTestCount + " passed, " + result.failedTestCount + " failed, " + result.skippedTestCount + " skipped")
        }
    }
}
    latitudeSodiumFogVerifier "maven.modrinth:AANobbMI:2Yom1N68"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def latitudeTestGeneratedResources = layout.buildDirectory.dir('generated/latitudeTest/resources')
def latitudeTestSequenceInput = providers.gradleProperty('latitudeTestSequence').orElse('missing')
def latitudeTestVersionInput = latitudeTestSequenceInput.map { raw ->
    "${project.version}-test.${raw}"
}

tasks.register('generateLatitudeTestMetadata') {
    group = 'latitude test artifact'
    description = 'Generate isolated TEST-only Fabric metadata; requires -PlatitudeTestSequence=N'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    inputs.property('latitudeTestSequence', latitudeTestSequenceInput)
    inputs.property('latitudeTestVersion', latitudeTestVersionInput)
    outputs.file(latitudeTestGeneratedResources.map { it.file('fabric.mod.json') })
    doLast {
        int sequence = latitudeTestSequenceValue()
        String testVersion = latitudeTestVersionValue(sequence)
        def publicJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(publicJar)
        def metadata
        try {
            def metadataEntry = zip.getEntry('fabric.mod.json')
            if (metadataEntry == null) {
                throw new GradleException("Public jar is missing fabric.mod.json: ${publicJar}")
            }
            metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(metadataEntry))
        } finally {
            zip.close()
        }
        metadata.version = testVersion
        metadata.entrypoints = new LinkedHashMap(metadata.entrypoints as Map)
        metadata.entrypoints.main = new ArrayList(metadata.entrypoints.main as List)
        metadata.entrypoints.main.add('com.example.globe.dev.LatitudeDevTestEntrypoint')
        metadata.entrypoints.client = new ArrayList(metadata.entrypoints.client as List)
        metadata.entrypoints.client.add('com.example.globe.dev.LatitudeDevTestClientEntrypoint')
        metadata.custom = ['latitude:test_artifact': true]

        def outputFile = latitudeTestGeneratedResources.get().file('fabric.mod.json').asFile
        outputFile.parentFile.mkdirs()
        outputFile.text = groovy.json.JsonOutput.toJson(metadata)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Implementation-Title': project.base.archivesName.get(),
                'Implementation-Version': project.version,
                'Minecraft-Version': project.minecraft_version,
                'Git-Commit': latitudeGitCommit,
                'Git-Branch': latitudeGitBranch,
                'Build-Time': latitudeBuildTime,
                'Build-Dirty': latitudeGitDirty
        )
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

def releaseArtifactExcludeSpec = { details ->
    def path = details.path
    if (path == null) {
        return false
    }

    if (path == 'com/example/globe/dev' || path.startsWith('com/example/globe/dev/')) {
        return true
    }

    if (path == 'com/example/globe/debug' || path.startsWith('com/example/globe/debug/')) {
        return true
    }

    // The dev-only clipboard helper must not ship in any release artifact: the compiled class
    // (and its inner classes) in the jar, and the source twin in the sources jar.
    if (path == 'com/example/globe/client/ClipboardImageWriter.class'
            || path == 'com/example/globe/client/ClipboardImageWriter.java'
            || path.startsWith('com/example/globe/client/ClipboardImageWriter$')) {
        return true
    }

    return false
}

def releaseArtifactPatternExcludes = [
        '**/*.sh',
        '**/*.bat',
        '**/*.exe',
        '**/*.dll',
        '**/*.dylib',
        '**/*.so',
        'tools/**',
        'scripts/**'
]

tasks.named('jar', Jar).configure {
    exclude(releaseArtifactExcludeSpec)
    exclude(releaseArtifactPatternExcludes)
}

tasks.named('sourcesJar', Jar).configure {
    from("LICENSE") {
        rename { it + "_" + project.base.archivesName.get() }
    }
    exclude(releaseArtifactExcludeSpec)
    exclude(releaseArtifactPatternExcludes)
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    exclude(releaseArtifactExcludeSpec)
    exclude(releaseArtifactPatternExcludes)
}

tasks.named(sourceSets.latitudeTest.compileJavaTaskName, JavaCompile).configure {
    dependsOn tasks.named('classes')
}

tasks.register('latitudeTestJar', Jar) {
    group = 'latitude test artifact'
    description = 'Build the isolated official-namespace dev-enabled TEST jar; requires -PlatitudeTestSequence=N'

    int sequence = latitudeTestSequenceOrZero()
    String testVersion = latitudeTestVersionValue(sequence)
    archiveFileName.set("latitude-${testVersion}.jar")
    destinationDirectory.set(layout.buildDirectory.dir('latitude-test-libs'))
    inputs.property('latitudeTestSequence', latitudeTestSequenceInput)
    inputs.property('latitudeTestVersion', latitudeTestVersionInput)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    dependsOn tasks.named('jar')
    dependsOn tasks.named(sourceSets.latitudeTest.classesTaskName)
    dependsOn tasks.named('generateLatitudeTestMetadata')
    doFirst {
        int validatedSequence = latitudeTestSequenceValue()
        String validatedVersion = latitudeTestVersionValue(validatedSequence)
        def publicJar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(publicJar)
        def publicManifest
        try {
            def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
            if (manifestEntry == null) {
                throw new GradleException("Public jar is missing META-INF/MANIFEST.MF: ${publicJar}")
            }
            publicManifest = new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
        } finally {
            zip.close()
        }
        def publicAttributes = publicManifest.mainAttributes
        manifest.attributes(
                'Implementation-Title': publicAttributes.getValue('Implementation-Title'),
                'Implementation-Version': validatedVersion,
                'Minecraft-Version': publicAttributes.getValue('Minecraft-Version'),
                'Git-Commit': publicAttributes.getValue('Git-Commit'),
                'Git-Branch': publicAttributes.getValue('Git-Branch'),
                'Build-Time': publicAttributes.getValue('Build-Time'),
                'Build-Dirty': publicAttributes.getValue('Build-Dirty'),
                'Latitude-Artifact-Role': 'TEST',
                'Latitude-Test-Sequence': Integer.toString(validatedSequence),
                'Latitude-Artifact-Version': validatedVersion,
                'Fabric-Mapping-Namespace': 'official'
        )
    }

    from({
        zipTree(tasks.named('jar', Jar).get().archiveFile.get().asFile)
    }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'fabric.mod.json'
    }

    from(sourceSets.main.output) {
        include 'com/example/globe/dev/**'
        include 'com/example/globe/debug/**'
        include 'com/example/globe/client/ClipboardImageWriter.class'
