// The dedicated server swallows start-up failures: net.minecraft.server.Main catches Throwable
// around the whole boot, logs "Failed to start the minecraft server" and returns normally, so
// the JVM -- and with it these tasks -- exited 0 after a boot that never loaded a world. The
// mod cannot fix that (no mod code runs after that line, and a shutdown hook cannot set the
// exit status), so the run task tees the server console into build/latitude-headless/ and
// tools/verify_headless_run.py decides PASS / FAIL / INVALID from what the run actually logged.
// Only PASS keeps the task green; a run without completion evidence is INVALID, not a pass.
def latitudeHeadlessCaptureDir = layout.buildDirectory.dir('latitude-headless')

def latitudeTeeStream = { OutputStream primary, OutputStream capture ->
    new OutputStream() {
        @Override
        void write(int b) { primary.write(b); capture.write(b) }

        @Override
        void write(byte[] b, int off, int len) { primary.write(b, off, len); capture.write(b, off, len) }

        @Override
        void flush() { primary.flush(); capture.flush() }
    }
}

def latitudeGuardHeadlessRun = { String taskName ->
    tasks.named(taskName).configure { task ->
        def captureFile = latitudeHeadlessCaptureDir.get().file("${taskName}.log").asFile
        doFirst {
            captureFile.parentFile.mkdirs()
            def capture = new FileOutputStream(captureFile)
            task.ext.latitudeCapture = capture
            task.standardOutput = latitudeTeeStream(System.out, capture)
            task.errorOutput = latitudeTeeStream(System.err, capture)
        }
        doLast {
            task.standardOutput.flush()
            task.errorOutput.flush()
            task.ext.latitudeCapture.close()
            def proc = new ProcessBuilder('python3', project.file('tools/verify_headless_run.py').path,
                    '--log', captureFile.path, '--task', taskName)
                    .directory(project.projectDir).redirectErrorStream(true).start()
            def out = proc.inputStream.text
            logger.lifecycle(out.trim())
            if (proc.waitFor() != 0) {
                throw new GradleException("${taskName}: the headless run did not complete -- see ${captureFile}")
            }
        }
    }
}
['runBiomePreview', 'runBiomeSeedSearch', 'runBandAudit'].each { latitudeGuardHeadlessRun(it) }

tasks.named('runBiomePreview').configure {
    workingDir file(latitudePreviewRunDir)
    dependsOn tasks.named('prepareBiomePreviewRunDir')
    if (project.hasProperty('latdev.syncPreviewMods') && project.property('latdev.syncPreviewMods').toString().toBoolean()) {
        dependsOn tasks.named('syncBiomePreviewMods')
    }
    doFirst {
        def sulfurScan = (findProperty('latdev.sulfurScan') ?: System.getProperty('latdev.sulfurScan') ?: '').toString()
        if (sulfurScan) {
            jvmArgs "-Dlatdev.sulfurScan=${sulfurScan}"
            logger.lifecycle("[runBiomePreview] forwarding latdev.sulfurScan to the preview JVM: {}", sulfurScan)
        }

        def badlandsScan = (findProperty('latdev.badlandsScan') ?: System.getProperty('latdev.badlandsScan') ?: '').toString()
        if (badlandsScan) {
            jvmArgs "-Dlatdev.badlandsScan=${badlandsScan}"
            logger.lifecycle("[runBiomePreview] forwarding latdev.badlandsScan to the preview JVM: {}", badlandsScan)
        }

        // Keep the recipe out of Loom's later JVM argument provider.
        def previewRecipe = System.getProperty('latdev.biomePng', '').trim() ?: 'enabled'
        def rawArgs = new ArrayList(args ?: [])
        def latdevOptions = [:]
        def passthrough = []
        def latdevKeys = ['seed', 'radius', 'size', 'step', 'steps', 'y', 'out', 'bundle', 'layers', 'mask', 'overlay', 'overlays', 'emitbiomeindex', 'emitheight'] as Set
        def mergeKeys = ['steps', 'layers', 'mask', 'overlay', 'overlays'] as Set
        def putLatdevOption = { key, value ->
            if (mergeKeys.contains(key) && latdevOptions.containsKey(key) && latdevOptions[key] != null && latdevOptions[key].toString().trim().length() > 0) {
                latdevOptions[key] = "${latdevOptions[key]},${value}"
            } else {
                latdevOptions[key] = value
            }
        }
        boolean enabled = false

        boolean emitHeightFlag = false

        for (int i = 0; i < rawArgs.size(); i++) {
            def token = rawArgs[i]
            if (!(token instanceof String) || !token.startsWith('--')) {
                passthrough << token
                continue
            }

            def body = token.substring(2)
            if (body.equalsIgnoreCase('emitHeight')) {
                emitHeightFlag = true
                continue
            }

            if (body.equalsIgnoreCase('latdevBiomePng')) {
                enabled = true
                continue
            }

            int eq = body.indexOf('=')
            if (eq >= 0) {
                def key = body.substring(0, eq).toLowerCase(Locale.ROOT)
                def value = body.substring(eq + 1)
                if (latdevKeys.contains(key)) {
                    putLatdevOption(key, value)
                    enabled = true
                } else {
                    passthrough << token
                }
                continue
            }

            def key = body.toLowerCase(Locale.ROOT)
            if (latdevKeys.contains(key)) {
                if (i + 1 < rawArgs.size() && rawArgs[i + 1] instanceof String && !rawArgs[i + 1].startsWith('--')) {
                    putLatdevOption(key, rawArgs[i + 1])
                    i++
                } else {
                    putLatdevOption(key, 'true')
                }
                enabled = true
            } else {
                passthrough << token
            }
        }

        if (emitHeightFlag) {
            jvmArgs "-Dlatitude.emitHeight=true"
        }

        if (enabled || !latdevOptions.isEmpty()) {
            if (!latdevOptions.containsKey('out')) {
                latdevOptions['out'] = file('run/latdev/atlas').absolutePath.replace('\\', '/')
            }

            def propParts = ['enabled=true']
            latdevOptions.each { key, value ->
                propParts << "${key}=${value}"
            }
            def propValue = propParts.join(';')

            previewRecipe = propValue
            setArgs(passthrough)
            logger.lifecycle("[runBiomePreview] translated latdev --args to JVM property: {}", propValue)
        } else {
            setArgs(rawArgs)
        }

        systemProperty 'latdev.biomePng', previewRecipe
        // allJvmArgs includes Loom's provider arguments; jvmArgs alone does not.
        def launchJvmArgs = allJvmArgs
        def expectedRecipeArg = "-Dlatdev.biomePng=${previewRecipe}".toString()
        if (launchJvmArgs.any {
            it.startsWith('-Dlatdev.biomePng=') && it != expectedRecipeArg
        }) {
            throw new GradleException('Biome preview recipe is shadowed by another JVM argument')
        }
    }
}

