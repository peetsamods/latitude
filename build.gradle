tasks.register('prepareBiomePreviewRunDir') {
    doLast {
        def dir = file(latitudePreviewRunDir)
        if (!dir.exists()) {
            dir.mkdirs()
        }

        def eulaFile = file("${dir}/eula.txt")
        eulaFile.text = "eula=true\n"

        def propsFile = file("${dir}/server.properties")
        if (!propsFile.exists()) {
            propsFile.text = """motd=Latitude Headless Preview
online-mode=false
max-players=1
enable-command-block=false
"""
        }

        def previewLevelName = (findProperty('latdev.preview.levelName') ?: System.getProperty('latdev.preview.levelName') ?: '').toString()
        def previewLevelSeed = (findProperty('latdev.preview.levelSeed') ?: System.getProperty('latdev.preview.levelSeed') ?: '').toString()
        def previewLevelType = (findProperty('latdev.preview.levelType') ?: System.getProperty('latdev.preview.levelType') ?: '').toString()
        if (previewLevelName || previewLevelSeed || previewLevelType) {
            def props = new Properties()
            propsFile.withInputStream { props.load(it) }
            if (previewLevelName) {
                props.setProperty('level-name', previewLevelName)
            }
            if (previewLevelSeed) {
                props.setProperty('level-seed', previewLevelSeed)
            }
            if (previewLevelType) {
                props.setProperty('level-type', previewLevelType)
            }
            propsFile.withOutputStream { props.store(it, 'Minecraft server properties') }
        }
    }
}

